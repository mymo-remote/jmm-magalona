<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox Zero Email System Demo — John Mark Magalona</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0d1b2a; --gold: #d4b453; --gold-dim: rgba(212,180,83,0.1);
      --gold-border: rgba(212,180,83,0.25); --green: #10b981; --blue: #3b82f6;
      --orange: #f59e0b; --red: #ef4444; --purple: #8b5cf6;
      --white: #fff; --gray-50: #f9fafb; --gray-100: #f3f4f6;
      --gray-200: #e5e7eb; --gray-400: #9ca3af; --gray-600: #6b7280;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: #f1f5f9; color: #1e293b; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .demo-banner {
      background: rgba(212,180,83,0.12); border-bottom: 1px solid var(--gold-border);
      padding: 7px 20px; text-align: center;
      font-size: 0.7rem; color: #7a5f1a; font-weight: 500; flex-shrink: 0;
    }
    .header {
      background: var(--navy); padding: 11px 20px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .back-link { font-size: 0.76rem; color: rgba(255,255,255,0.5); transition: color 0.2s; }
    .back-link:hover { color: var(--gold); }
    .header-title { font-family: var(--serif); font-size: 1rem; color: var(--white); }
    .header-title span { color: var(--gold); }
    .header-badge { background: var(--gold-dim); border: 1px solid var(--gold-border); color: var(--gold); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 4px; }

    /* EMAIL CLIENT LAYOUT */
    .app { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 210px; flex-shrink: 0; background: var(--navy); display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-section { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .sidebar-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.3); padding: 0 16px 8px; }
    .folder-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 9px 16px; border: none; cursor: pointer;
      background: transparent; color: rgba(255,255,255,0.65);
      font-family: var(--sans); font-size: 0.8rem; text-align: left;
      transition: background 0.2s, color 0.2s;
    }
    .folder-btn:hover { background: rgba(255,255,255,0.06); color: var(--white); }
    .folder-btn.active { background: rgba(212,180,83,0.15); color: var(--gold); }
    .folder-left { display: flex; align-items: center; gap: 10px; }
    .folder-icon { font-size: 0.85rem; }
    .folder-count { font-size: 0.65rem; font-weight: 700; background: var(--gold); color: var(--navy); border-radius: 10px; padding: 1px 6px; }
    .compose-btn { margin: 14px 12px 0; background: var(--gold); color: var(--navy); font-weight: 700; font-size: 0.8rem; padding: 10px; border-radius: 7px; border: none; cursor: pointer; width: calc(100% - 24px); }

    /* EMAIL LIST */
    .email-list { width: 300px; flex-shrink: 0; background: var(--white); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; overflow: hidden; }
    .list-header { padding: 14px 16px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; }
    .list-title { font-weight: 700; font-size: 0.9rem; }
    .list-meta { font-size: 0.72rem; color: var(--gray-400); }
    .email-items { flex: 1; overflow-y: auto; }
    .email-item {
      padding: 14px 16px; border-bottom: 1px solid var(--gray-100); cursor: pointer;
      transition: background 0.15s; position: relative;
    }
    .email-item:hover { background: var(--gray-50); }
    .email-item.active { background: rgba(212,180,83,0.08); border-left: 3px solid var(--gold); }
    .email-item.unread .email-sender { font-weight: 700; }
    .email-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .email-sender { font-size: 0.83rem; color: var(--navy); }
    .email-time { font-size: 0.68rem; color: var(--gray-400); white-space: nowrap; }
    .email-subject { font-size: 0.78rem; font-weight: 600; color: #334155; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .email-preview { font-size: 0.72rem; color: var(--gray-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .priority-dot { width: 7px; height: 7px; border-radius: 50%; position: absolute; right: 14px; bottom: 14px; }
    .email-tags { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
    .email-tag { font-size: 0.58rem; font-weight: 700; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* EMAIL PREVIEW */
    .email-preview-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .preview-header { padding: 20px 24px; border-bottom: 1px solid var(--gray-200); background: var(--white); }
    .preview-subject { font-family: var(--serif); font-size: 1.2rem; margin-bottom: 12px; }
    .preview-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .preview-from { font-size: 0.82rem; color: var(--gray-600); }
    .preview-from strong { color: var(--navy); }
    .preview-actions { display: flex; gap: 8px; margin-left: auto; }
    .action-btn { font-size: 0.75rem; font-weight: 600; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--gray-200); cursor: pointer; background: var(--white); transition: background 0.2s; }
    .action-btn:hover { background: var(--gray-50); }
    .action-btn.primary { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .action-btn.primary:hover { opacity: 0.85; }
    .preview-body { flex: 1; overflow-y: auto; padding: 24px; background: var(--gray-50); }
    .email-body-card { background: var(--white); border-radius: 10px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .email-body-card p { font-size: 0.88rem; line-height: 1.75; color: #334155; margin-bottom: 14px; }
    .email-body-card p:last-child { margin-bottom: 0; }
    .va-action-bar { padding: 14px 24px; background: var(--white); border-top: 1px solid var(--gray-200); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .va-label { font-size: 0.72rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.07em; }
    .va-action { font-size: 0.75rem; font-weight: 600; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--gold-border); color: var(--navy); cursor: pointer; background: var(--gold-dim); transition: background 0.2s; }
    .va-action:hover { background: rgba(212,180,83,0.2); }
    .va-action.done { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--green); }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gray-400); gap: 12px; }
    .empty-icon { font-size: 2.5rem; }
    .empty-text { font-size: 0.9rem; font-weight: 500; }
  </style>
</head>
<body>

  <div class="demo-banner"><strong>Interactive Demo</strong> — Click emails to read them. Use the action buttons to see how inbox triage works.</div>
  <div class="header">
    <div class="header-left">
      <a href="index.html" class="back-link">← Portfolio</a>
      <div class="header-title">JMM <span>Inbox</span></div>
    </div>
    <div class="header-badge">Inbox Zero System</div>
  </div>

  <div class="app">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <button class="compose-btn">+ Compose</button>
      <div class="sidebar-section">
        <div class="sidebar-label">Folders</div>
        <button class="folder-btn active" onclick="setFolder('inbox',this)"><span class="folder-left"><span class="folder-icon">📥</span>Inbox</span><span class="folder-count" id="inboxCount">5</span></button>
        <button class="folder-btn" onclick="setFolder('action',this)"><span class="folder-left"><span class="folder-icon">⚡</span>Action Required</span><span class="folder-count" id="actionCount">3</span></button>
        <button class="folder-btn" onclick="setFolder('waiting',this)"><span class="folder-left"><span class="folder-icon">⏳</span>Waiting</span></button>
        <button class="folder-btn" onclick="setFolder('archive',this)"><span class="folder-left"><span class="folder-icon">📂</span>Archive</span></button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Labels</div>
        <button class="folder-btn" onclick="setFolder('client',this)"><span class="folder-left"><span class="folder-icon">🏢</span>Client</span></button>
        <button class="folder-btn" onclick="setFolder('invoice',this)"><span class="folder-left"><span class="folder-icon">💰</span>Finance</span></button>
        <button class="folder-btn" onclick="setFolder('urgent',this)"><span class="folder-left"><span class="folder-icon">🔴</span>Urgent</span></button>
      </div>
    </div>

    <!-- EMAIL LIST -->
    <div class="email-list">
      <div class="list-header">
        <div class="list-title" id="listTitle">Inbox</div>
        <div class="list-meta" id="listMeta">5 emails</div>
      </div>
      <div class="email-items" id="emailItems"></div>
    </div>

    <!-- PREVIEW -->
    <div class="email-preview-pane" id="previewPane">
      <div class="empty-state">
        <div class="empty-icon">📧</div>
        <div class="empty-text">Select an email to read</div>
      </div>
    </div>
  </div>

  <script>
    const EMAILS = [
      {
        id: 1, folder: ['inbox','client','urgent'], unread: true,
        from: 'Karen Whitfield', email: 'k.whitfield@firstnational.com.au',
        subject: 'URGENT: Settlement Documents — 42 Coral St Bundaberg',
        time: '9:02 AM', preview: 'Hi John, the settlement is tomorrow and we still haven\'t...',
        priority: '#ef4444',
        tags: [{ label: 'Real Estate', color: '#dbeafe', text: '#1d4ed8' }, { label: 'Urgent', color: '#fee2e2', text: '#dc2626' }],
        body: `<p>Hi John,</p>
<p>The settlement for 42 Coral St is tomorrow at 2pm and we still haven't received the signed Form 6 from the vendor. Can you please chase this up ASAP and coordinate with our solicitors?</p>
<p>Also need you to update Rex CRM with the settlement date and flag this for the principal agent's review.</p>
<p>Thanks,<br>Karen</p>`,
        vaActions: ['Reply to Karen', 'Log in Rex CRM', 'Chase vendor docs', 'Set reminder']
      },
      {
        id: 2, folder: ['inbox','action'], unread: true,
        from: 'Domain.com.au Listings', email: 'listings@domain.com.au',
        subject: 'Action Required: Listing 18 Mango Ave Needs Photos',
        time: '8:47 AM', preview: 'Your listing at 18 Mango Ave is missing professional photos...',
        priority: '#f59e0b',
        tags: [{ label: 'Listing', color: '#fef9c3', text: '#854d0e' }],
        body: `<p>Hi,</p>
<p>Your listing at 18 Mango Ave, Cairns is currently live but missing professional photos. Listings with photos receive 4x more enquiries.</p>
<p>Please upload at least 8 photos within 48 hours to avoid reduced visibility.</p>
<p>— Domain Listings Team</p>`,
        vaActions: ['Notify agent', 'Schedule photographer', 'Update listing', 'Archive']
      },
      {
        id: 3, folder: ['inbox','action'], unread: true,
        from: 'Tom Nguyen (Lead)', email: 't.nguyen@harcourts.com.au',
        subject: 'RE: VA Services Enquiry — Can we chat Thursday?',
        time: 'Yesterday', preview: 'Thanks for the follow-up. We had a team meeting and...',
        priority: '#10b981',
        tags: [{ label: 'Lead', color: '#dcfce7', text: '#166534' }],
        body: `<p>Hi John,</p>
<p>Thanks for the follow-up. We had a team meeting on Monday and the team is interested in moving forward with a 2-week trial period.</p>
<p>Can we do a quick call Thursday at 2pm AEST to run through scope and rate?</p>
<p>Tom</p>`,
        vaActions: ['Reply with Calendly', 'Update CRM stage', 'Prep call brief', 'Archive']
      },
      {
        id: 4, folder: ['inbox','invoice'], unread: false,
        from: 'Xero Accounting', email: 'notifications@xero.com',
        subject: 'Invoice #0021 — $2,400 AUD due in 3 days',
        time: 'Yesterday', preview: 'Your invoice to First National Bundaberg is due on...',
        priority: '#8b5cf6',
        tags: [{ label: 'Finance', color: '#ede9fe', text: '#5b21b6' }],
        body: `<p>Hi,</p>
<p>This is a reminder that Invoice #0021 for $2,400 AUD issued to First National Bundaberg is due in 3 days (15 July 2026).</p>
<p>View invoice | Send reminder | Mark as paid</p>`,
        vaActions: ['Flag for principal', 'Send payment reminder', 'Archive']
      },
      {
        id: 5, folder: ['inbox'], unread: false,
        from: 'REA Group', email: 'noreply@realestate.com.au',
        subject: 'Your Listing Performance Report — Week of 30 Jun',
        time: 'Mon', preview: 'This week\'s report: 3 listings, 127 views, 8 enquiries...',
        priority: null,
        tags: [{ label: 'Report', color: '#f3f4f6', text: '#6b7280' }],
        body: `<p>Weekly Performance Summary</p>
<p><strong>Active listings:</strong> 3<br><strong>Total views:</strong> 127<br><strong>Enquiries:</strong> 8<br><strong>Saved by users:</strong> 14</p>
<p>Your top performer: 42 Coral St Bundaberg — 54 views this week.</p>`,
        vaActions: ['Save to Drive', 'Share with agent', 'Archive']
      },
      {
        id: 6, folder: ['action'], unread: true,
        from: 'Daniel Forsythe (Lead)', email: 'd.forsythe@belleproperty.com',
        subject: 'Contract Ready — Can you check before I send?',
        time: '2hr ago', preview: 'Hey John, I\'ve drafted the service agreement. Can you...',
        priority: '#ef4444',
        tags: [{ label: 'Lead', color: '#dcfce7', text: '#166534' }, { label: 'Action', color: '#fee2e2', text: '#dc2626' }],
        body: `<p>Hey John,</p>
<p>I've drafted the service agreement for the 2-week trial. Can you review it for any gaps before I forward to legal?</p>
<p>Main points: $3,000 AUD/month trial, listings + vendor comms + CRM scope, 2-week notice clause.</p>
<p>Dan</p>`,
        vaActions: ['Reply', 'Review document', 'Flag for principal', 'Move to Waiting']
      },
      {
        id: 7, folder: ['action'], unread: false,
        from: 'Console Cloud', email: 'noreply@console.com.au',
        subject: 'Lease Renewal Due: 7/12 Pacific Ave — 14 Days Notice',
        time: 'Tue', preview: 'Automated notice: lease at 7/12 Pacific Ave expires...',
        priority: '#f59e0b',
        tags: [{ label: 'Property Mgmt', color: '#fef9c3', text: '#854d0e' }],
        body: `<p>Automated Notice from Console Cloud</p>
<p>Lease at <strong>7/12 Pacific Ave, Gold Coast</strong> expires in 14 days (15 July 2026).</p>
<p>Tenant: Mr. B. Santos. Current rent: $520/week. Action required: contact tenant re renewal intentions.</p>`,
        vaActions: ['Contact tenant', 'Log in Console', 'Notify landlord', 'Archive']
      },
      {
        id: 8, folder: ['archive'], unread: false,
        from: 'Amanda Chen', email: 'a.chen@mcgrath.com.au',
        subject: 'RE: Proposal — Happy to proceed with the trial',
        time: '3 days ago', preview: 'Hi John, the team reviewed your proposal and we\'re happy...',
        priority: null,
        tags: [{ label: 'Client', color: '#dbeafe', text: '#1d4ed8' }],
        body: `<p>Hi John,</p>
<p>The team reviewed your proposal and we're happy to proceed with the 2-week trial. Rate of $3,200/month as discussed.</p>
<p>Can we schedule an onboarding call for Friday?</p>
<p>Amanda</p>`,
        vaActions: ['Send Calendly', 'Begin onboarding', 'Archive']
      },
    ];

    let currentFolder = 'inbox';
    let currentEmailId = null;
    const actionsDone = {};

    function setFolder(folder, btn) {
      currentFolder = folder;
      currentEmailId = null;
      document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const titles = { inbox: 'Inbox', action: 'Action Required', waiting: 'Waiting on Others', archive: 'Archive', client: 'Client', invoice: 'Finance', urgent: 'Urgent' };
      const filtered = EMAILS.filter(e => e.folder.includes(folder));
      document.getElementById('listTitle').textContent = titles[folder] || folder;
      document.getElementById('listMeta').textContent = filtered.length + ' email' + (filtered.length !== 1 ? 's' : '');
      renderList(filtered);
      document.getElementById('previewPane').innerHTML = `<div class="empty-state"><div class="empty-icon">📧</div><div class="empty-text">Select an email to read</div></div>`;
    }

    function renderList(emails) {
      document.getElementById('emailItems').innerHTML = emails.length === 0
        ? '<div style="padding:32px 16px;text-align:center;color:#9ca3af;font-size:0.85rem;">No emails in this folder</div>'
        : emails.map(e => `
        <div class="email-item ${e.unread ? 'unread' : ''} ${currentEmailId === e.id ? 'active' : ''}" onclick="openEmail(${e.id})">
          <div class="email-item-top">
            <div class="email-sender">${e.from}</div>
            <div class="email-time">${e.time}</div>
          </div>
          <div class="email-subject">${e.subject}</div>
          <div class="email-preview">${e.preview}</div>
          <div class="email-tags">${e.tags.map(t=>`<span class="email-tag" style="background:${t.color};color:${t.text}">${t.label}</span>`).join('')}</div>
          ${e.priority ? `<div class="priority-dot" style="background:${e.priority}"></div>` : ''}
        </div>`).join('');
    }

    function openEmail(id) {
      currentEmailId = id;
      const e = EMAILS.find(x => x.id === id);
      e.unread = false;
      if (!actionsDone[id]) actionsDone[id] = {};
      const pane = document.getElementById('previewPane');
      pane.innerHTML = `
        <div class="preview-header">
          <div class="preview-subject">${e.subject}</div>
          <div class="preview-meta">
            <div class="preview-from"><strong>${e.from}</strong> &lt;${e.email}&gt;</div>
            <div class="preview-actions">
              <button class="action-btn" onclick="alert('Reply template loaded.')">Reply</button>
              <button class="action-btn primary" onclick="alert('Archived.')">Archive</button>
            </div>
          </div>
        </div>
        <div class="preview-body">
          <div class="email-body-card">${e.body}</div>
        </div>
        <div class="va-action-bar">
          <span class="va-label">VA Actions:</span>
          ${e.vaActions.map((a,i) => `<button class="va-action ${actionsDone[id][i] ? 'done' : ''}" onclick="doAction(${id},${i},'${a}')">${actionsDone[id][i] ? '✓ ' : ''}${a}</button>`).join('')}
        </div>`;
      renderList(EMAILS.filter(em => em.folder.includes(currentFolder)));
    }

    function doAction(id, idx, label) {
      actionsDone[id][idx] = true;
      openEmail(id);
    }

    // Init
    renderList(EMAILS.filter(e => e.folder.includes('inbox')));
  </script>
</body>
</html>
